<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 55" width="160" height="55">
  <defs>
    <linearGradient id="vignanBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Clean Floral / Botanical Academic Mark -->
  <g transform="translate(132, 22) scale(0.95)" fill="url(#vignanBrandGrad)">
    <!-- Top Petal -->
    <path d="M 0 -14 C 4 -8, 4 -2, 0 0 C -4 -2, -4 -8, 0 -14 Z" />
    <!-- Top Right Petal -->
    <path d="M 0 0 C 6 -6, 12 -4, 13 2 C 7 3, 3 1, 0 0 Z" />
    <!-- Bottom Right Petal -->
    <path d="M 0 0 C 5 3, 10 7, 8 13 C 3 11, 1 6, 0 0 Z" />
    <!-- Bottom Left Petal -->
    <path d="M 0 0 C -5 3, -10 7, -8 13 C -3 11, -1 6, 0 0 Z" />
    <!-- Top Left Petal -->
    <path d="M 0 0 C -6 -6, -12 -4, -13 2 C -7 3, -3 1, 0 0 Z" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="2.2" fill="#38bdf8" />
  </g>

  <!-- Typography: VIGNAN -->
  <text x="6" y="24" 
        font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" 
        font-size="19" 
        font-weight="900" 
        letter-spacing="1.2" 
        fill="#1e3a8a">
    VIGNAN
  </text>

  <!-- Subtitle Motto: For a Better Tomorrow -->
  <text x="7" y="38" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="0.3" 
        fill="#475569">
    For a Better Tomorrow
  </text>
</svg>
